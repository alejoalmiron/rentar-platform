syntax = "proto3";
package vehicle.v1;

service VehicleService {
  rpc GetVehicles (Empty) returns (VehicleList);
  rpc GetVehicleById (VehicleIdRequest) returns (Vehicle);
  rpc CreateVehicle (CreateVehicleRequest) returns (Vehicle);
  rpc UpdateVehicle (UpdateVehicleRequest) returns (Vehicle);
  rpc DeleteVehicle (VehicleIdRequest) returns (Empty);
  rpc CheckOperative (VehicleIdRequest) returns (OperativeResponse);
}

message Empty {}

message VehicleIdRequest {
  int32 id = 1;
}

message Vehicle {
  int32 id = 1;
  string marca = 2;
  string modelo = 3;
  string patente = 4;
  bool operativo = 5;
  bool activo = 6;
  int32 anio = 7;
  string color = 8;
  string tipo = 9;
  double precio_diario = 10;
  string estado = 11;
}

message VehicleList {
  repeated Vehicle vehicles = 1;
}

message CreateVehicleRequest {
  string marca = 1;
  string modelo = 2;
  string patente = 3;
  int32 anio = 4;
  string color = 5;
  string tipo = 6;
  double precio_diario = 7;
  string estado = 8;
}

message UpdateVehicleRequest {
  int32 id = 1;
  string marca = 2;
  string modelo = 3;
  string patente = 4;
  bool operativo = 5;
  int32 anio = 6;
  string color = 7;
  string tipo = 8;
  double precio_diario = 9;
  string estado = 10;
}

message OperativeResponse {
  bool operativo = 1;
}