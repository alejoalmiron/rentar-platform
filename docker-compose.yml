version: '3.8'

services:
  # Bases de datos: una por microservicio.
  vehicle-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vehicle_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3308:3306"
    volumes:
      - vehicle_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  customer-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3310:3306"
    volumes:
      - customer_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rental-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rental_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3309:3306"
    volumes:
      - rental_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Broker de mensajes. El panel web queda en el puerto 15672.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Declara exchange y colas antes de que arranque cualquier productor, y termina.
  broker-init:
    build:
      context: ./workers
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONUNBUFFERED: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # NUEVO SERVICIO: Worker de Verificación Policial
  verificacion-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    command: ["python", "-u", "verificacion_worker.py"]
    volumes:
      - ./workers:/app
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONUNBUFFERED: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Servicios gRPC y workers. Los que usan eventos esperan a broker-init.
  vehicle-service:
    build: ./services/vehicle-service
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}@vehicle-db:3306/vehicle_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PORT: 50051
      PYTHONUNBUFFERED: 1
    ports:
      - "50051:50051"
    depends_on:
      vehicle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully

  validador-patente:
    build:
      context: .
      dockerfile: workers/Dockerfile.runtime
    command: ["python", "workers/validador_patente_worker.py"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONUNBUFFERED: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully

  validador-titularidad:
    build:
      context: .
      dockerfile: workers/Dockerfile.runtime
    command: ["python", "workers/validador_titularidad_worker.py"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONUNBUFFERED: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully

  correlador-externos:
    build:
      context: .
      dockerfile: workers/Dockerfile.runtime
    command: ["python", "workers/correlador_externos_worker.py"]
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}@vehicle-db:3306/vehicle_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONUNBUFFERED: 1
    depends_on:
      vehicle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully

  customer-service:
    build: ./services/customer-service
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}@customer-db:3306/customer_db
      PORT: 50052
      PYTHONUNBUFFERED: 1
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?Set SEED_ADMIN_USERNAME in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_CLIENT_USERNAME: ${SEED_CLIENT_USERNAME:?Set SEED_CLIENT_USERNAME in .env}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:?Set SEED_CLIENT_PASSWORD in .env}
      SEED_CLIENT_DNI: ${SEED_CLIENT_DNI:?Set SEED_CLIENT_DNI in .env}
    ports:
      - "50052:50052"
    depends_on:
      customer-db:
        condition: service_healthy

  rental-service:
    build:
      context: .
      dockerfile: services/rental-service/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}@rental-db:3306/rental_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      VEHICLE_GRPC_ADDRESS: vehicle-service:50051
      PYTHONPATH: /app:/app/app/generated
      PYTHONUNBUFFERED: 1
    ports:
      - "50053:50053"
    depends_on:
      rental-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
      vehicle-service:
        condition: service_started

  mantenimiento-worker:
    build:
      context: .
      dockerfile: services/rental-service/Dockerfile
    command: ["python", "app/mantenimiento_worker.py"]
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}@rental-db:3306/rental_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PYTHONPATH: /app:/app/app/generated
      PYTHONUNBUFFERED: 1
    depends_on:
      rental-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Entrada al sistema: la web solo habla con el Gateway.
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      VEHICLE_GRPC_ADDRESS: vehicle-service:50051
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
      RENTAL_GRPC_ADDRESS: rental-service:50053
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    ports:
      - "5000:5000"
    depends_on:
      vehicle-service:
        condition: service_started
      customer-service:
        condition: service_started
      rental-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully

  frontend:
    build: ./front/mi-app
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  rabbitmq_data:
  vehicle_data:
  customer_data:
  rental_data: