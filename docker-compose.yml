services:
  db:
    image: mysql:8.0
    container_name: mysql_rental_db
    restart: always
    environment:
      MYSQL_DATABASE: rental_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rental-service:
    build:
      context: ./services/rental-service
      dockerfile: Dockerfile
    container_name: rental_service_container
    restart: always
    ports:
      - "50053:50053"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/rental_db
      - PYTHONPATH=/app:/app/app/generated
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

volumes:
  mysql_data: